name: ground_control_client
version: 0.38.0
description: A client library for the Serverpod Ground Control API. Used to manage Serverpod Cloud projects.
repository: https://github.com/serverpod/serverpod_cloud_clients
homepage: https://serverpod.dev
issue_tracker: https://github.com/serverpod/serverpod_cloud_clients/issues

topics:
  - api
  - client

environment:
  # Note, this range must include all the supported customer Dart SDK versions.
  sdk: ">=3.10.3 <4.0.0"


dependencies:
  http: ^1.2.2
  serverpod_client: 4.0.0-beta.3
  serverpod_auth_core_client: 4.0.0-beta.3
  serverpod_auth_idp_client: 4.0.0-beta.3
